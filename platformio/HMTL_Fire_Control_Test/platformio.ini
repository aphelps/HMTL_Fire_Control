# FC_SWITCHES_TEST_FAULT_INJECTION compiles a hook into Fire_Control_Sensors.cpp
# that lets a test make the switch-bank read FAIL.  It is set HERE and nowhere
# else -- no firmware environment defines it.  It exists because the direct-GPIO
# switch path has no failure mode of its own, while the behaviour it gates (what
# a failed read does to fc_switches_read_ok(), and therefore whether the OTA
# guard permits an upload) is the most dangerous branch in this firmware.
# Without the hook that branch is reachable only on the MCP23017 hardware path,
# which is not on this branch, so the permit-on-fault regression would be
# untestable until after a merge.
[env:native]
platform = native
test_framework = unity
lib_deps = fire_control_sources
# test_switch_health needs FC_SWITCHES_MCP23017; it runs under env:native_mcp.
test_ignore = test_switch_health

build_flags =
  -std=c++11
  -include Arduino.h
  -I stubs
  -I /Users/amp/Dropbox/Arduino/HMTL_Ecosystem/HMTL/platformio/HMTL_Test/stubs
  -I ../../HMTL_Fire_Control_Wickerman
  -I /Users/amp/Dropbox/Arduino/HMTL_Ecosystem/HMTL/Libraries/HMTLTypes
  -I /Users/amp/Dropbox/Arduino/HMTL_Ecosystem/HMTL/Libraries/HMTLProtocol
  -I /Users/amp/Dropbox/Arduino/HMTL_Ecosystem/HMTL/Libraries/HMTLMessaging
  -I /Users/amp/Dropbox/Arduino/HMTL_Ecosystem/HMTL/Libraries/HMTLPoofer
  -I /Users/amp/Dropbox/Arduino/libraries/Socket
  -DDISABLE_RS485
  -DDISABLE_MPR121
  -DDISABLE_XBEE
  -DDEBUG_LEVEL=5
  -DOBJECT_TYPE=5
  -DCONTROL_MODE=4
  -DPOOFER1_ADDRESS=66
  -DPOOFER2_ADDRESS=69
  -DLIGHTS_ADDRESS=67
  -DFC_SWITCHES_TEST_FAULT_INJECTION
  -DFC_ENABLE_COMBOS

[env:native_coverage]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -fprofile-instr-generate
  -fcoverage-mapping
  -L/Library/Developer/CommandLineTools/usr/lib/clang/17/lib/darwin
  -lclang_rt.profile_osx

# The MCP23017 switch path, which env:native cannot reach: without this flag
# sensor_switches() compiles the GPIO branch, where digitalRead cannot fail and
# every read is healthy by construction. One binary cannot test both sides of a
# compile flag, so the read-health tests get their own env.
[env:native_mcp]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -DFC_SWITCHES_MCP23017
# Clears the inherited test_ignore -- extends would otherwise make this env skip
# the one test it exists to run, and PlatformIO applies ignore over filter.
test_ignore =
test_filter = test_switch_health
