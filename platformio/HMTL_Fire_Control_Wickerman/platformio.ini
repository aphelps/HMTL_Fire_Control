#
# Project Configuration File
#
# A detailed documentation with the EXAMPLES is located here:
# http://docs.platformio.org/en/latest/projectconf.html
#

[DEFAULT]
GLOBAL_COMPILEFLAGS= -DPLATFORMIO -Wall
GLOBAL_DEBUGLEVEL= -DDEBUG_LEVEL=2

LOCAL_DEBUGLEVEL= -DDEBUG_LEVEL_SENSORS=3 -DDEBUG_LEVEL_MODES=1 -DDEBUG_LEVEL_CONNECT=2

#
# Controller type constants
#
FIRE_CONTROLLER = 4
TOUCH_CONTROLLER = 5

#
# HMTL Addresses for controlled devices
#
POOFER1_ADDRESS = 66 # 69
POOFER2_ADDRESS = 69 # 66
LIGHTS_ADDRESS = 67 # 67

#
# Control modes
#
# CONTROL_SINGLE_DOUBLE: Single ignitor/pilot with two accumulators.
# CONTROL_SINGLE_QUAD:   Single ignitor/pilot with four accumulators.
# CONTROL_DOUBLE_DOUBLE: Two devices, each with single ignitor/pilot
#                        and two accumulators.
# CONTROL_SINGLE_QUINT:  Two HMTL controllers for five accumulators, one igniter,
#                        and one pilot, plus optional HMTL controller for lights.
#
CONTROL_MODE=CONTROL_SINGLE_QUINT


OPTION_FLAGS = -DLIGHTS_ADDRESS=%(LIGHTS_ADDRESS)s -DPOOFER1_ADDRESS=%(POOFER1_ADDRESS)s -DPOOFER2_ADDRESS=%(POOFER2_ADDRESS)s -DCONTROL_MODE=%(CONTROL_MODE)s

# All global build flags
GLOBAL_BUILDFLAGS= %(GLOBAL_COMPILEFLAGS)s %(GLOBAL_DEBUGLEVEL)s %(LOCAL_DEBUGLEVEL)s %(OPTION_FLAGS)s

# Shared flags for the ESP32 touch-controller envs; production and bench differ
# ONLY in debug level and target addresses.  Safety-relevant pin choices live
# here exactly once.
# Compiles the guarded HTTP /update endpoint in.  Kept here, next to
# ESP32_TOUCH_FLAGS, so the OTA envs below cannot drift apart in what they
# enable.  FC_OTA_PASS is NOT set here and must never be: it is a secret, it is
# mandatory whenever this flag is present, and the build fails without it.
FC_OTA_FLAGS = -DFC_OTA_ENABLE

ESP32_TOUCH_FLAGS = -DOBJECT_TYPE=%(TOUCH_CONTROLLER)s -DESP32 -DDEBUG_LEVEL_API=3 -DIRQ_PIN=4 -DRS485_HARDWARE_SERIAL=Serial2 -DRS485_ENABLE_PIN=18 -DFC_SWITCHES_MCP23017 -DSERIAL_BAUD=115200 -DPIXELS_WS2801_25_23

[platformio]
lib_dir = /Users/amp/Dropbox/Arduino/libraries
src_dir = ../../HMTL_Fire_Control_Wickerman/

# LDF chain mode does not evaluate #if defined(ESP32), so WiFi-only libraries
# must be explicitly ignored on the AVR envs or they fail those builds.
[common]
esp_only_libs =
  WiFiBase
  TCPSocket

# This environment is for the classic 2014 wooden 4-sensor (plus 4 external) touch controller
[env:firecontroller]
platform = atmelavr
framework = arduino
board = nanoatmega328
build_flags = %(GLOBAL_BUILDFLAGS)s -DOBJECT_TYPE=%(FIRE_CONTROLLER)s
lib_ignore = ${common.esp_only_libs}
upload_port = /dev/cu.usbserial-A602UVQ7

# Lightbringer: the classic 2014 AVR fire-control box driving the Lightbringer
# art car's trigger boards (POOFER1=71, POOFER2=72, LIGHTS=67) — interim
# controller until the new touchcontroller board is built.  Same address set as
# touchcontroller_esp32_bench.
[env:firecontroller_lightbringer]
platform = atmelavr
framework = arduino
board = nanoatmega328
build_flags =
    %(GLOBAL_COMPILEFLAGS)s
    %(GLOBAL_DEBUGLEVEL)s
    %(LOCAL_DEBUGLEVEL)s
    -DLIGHTS_ADDRESS=67 -DPOOFER1_ADDRESS=71 -DPOOFER2_ADDRESS=72 -DCONTROL_MODE=%(CONTROL_MODE)s
    -DOBJECT_TYPE=%(FIRE_CONTROLLER)s
lib_ignore = ${common.esp_only_libs}
upload_port = /dev/cu.usbserial-A602UVQ7

# This environment is for the 12-sensor 2016 Touch Controller
[env:touchcontroller]
platform = atmelavr
framework = arduino
board = nanoatmega328
build_flags = %(GLOBAL_BUILDFLAGS)s -DOBJECT_TYPE=%(TOUCH_CONTROLLER)s
lib_ignore = ${common.esp_only_libs}
upload_port = /dev/cu.usbserial-12AP0262

# ESP32 touch controller — SparkFun LoRa 1-CH Gateway board.
# GPIO map and reservations: docs/fire-controller-esp32/WIRING.md (parent repo).
# Switches are read from the MCP23017 expander at 0x26 (FC_SWITCHES_MCP23017).
[env:touchcontroller_esp32]
platform = espressif32
framework = arduino
board = esp32dev
build_flags =
    %(GLOBAL_BUILDFLAGS)s
    %(ESP32_TOUCH_FLAGS)s
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4

# Bench variant of touchcontroller_esp32: bench poofer/lights addresses and
# DEBUG_LEVEL=4.  All pin choices come from ESP32_TOUCH_FLAGS -- shared with
# the production env so a safety-relevant pin fix cannot land in one and miss
# the other.
[env:touchcontroller_esp32_bench]
platform = espressif32
framework = arduino
board = esp32dev
build_flags =
    %(GLOBAL_COMPILEFLAGS)s
    -DDEBUG_LEVEL=4
    %(LOCAL_DEBUGLEVEL)s
    -DLIGHTS_ADDRESS=67 -DPOOFER1_ADDRESS=71 -DPOOFER2_ADDRESS=72 -DCONTROL_MODE=%(CONTROL_MODE)s
    %(ESP32_TOUCH_FLAGS)s
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4

#
# OTA (over-the-air) upload variants
# ----------------------------------
# The base touchcontroller_esp32* envs above stay SERIAL-ONLY on purpose: serial
# is the recovery path, and it must keep working on an image whose OTA endpoint
# is broken.  Recovery procedure -- box power off AND the 3V3 feed disconnected
# before USB goes in; the board has no 5V input pad, so box power back-drives the
# regulator (docs/fire-controller-esp32/OTA.md).
#
# Transport is HTTP, not espota: macOS Sequoia blocks espota's UDP, so espota
# would work on the device and fail at the toolchain.  tools/upload_ota.py POSTs
# the image with curl, following the WLED_dev env:ampworks precedent.
#
# FC_OTA_ENABLE compiles the /update endpoint in; FC_OTA_PASS is then MANDATORY
# and the build fails without it (the #error is in HMTL_Fire_Control_API.cpp)
# -- an ignition controller must never expose an unauthenticated firmware
# upload.  FC_OTA_PASS must reach the COMPILER as a -D; a bare environment
# variable of that name does not, and the build will fail with the #error.  The
# env var by that name is read only by tools/upload_ota.py, at upload time.
# Pass it at build time and keep it out of the tree:
#     PLATFORMIO_BUILD_FLAGS='-DFC_OTA_PASS=\"...\"' pio run -e touchcontroller_esp32_ota
# (the inner escaped quotes are what make the value a C string literal -- the
# same form wifi_credentials.h.example uses for FC_WIFI_AP_PASS), or define
# FC_OTA_PASS in the untracked wifi_credentials.h alongside the WiFi
# credentials, which needs no flags at all.
#
# Uploading rebuilds, so an upload needs BOTH: the -D for the compiler and
# FC_OTA_PASS in the environment for the upload script.
#     PLATFORMIO_BUILD_FLAGS='-DFC_OTA_PASS=\"...\"' FC_OTA_PASS='...' \
#       pio run -e touchcontroller_esp32_ota -t upload
#
[env:touchcontroller_esp32_ota]
extends = env:touchcontroller_esp32
build_flags =
    %(GLOBAL_BUILDFLAGS)s
    %(ESP32_TOUCH_FLAGS)s
    %(FC_OTA_FLAGS)s
upload_protocol = custom
upload_port = 192.168.1.59
extra_scripts = post:tools/upload_ota.py

[env:touchcontroller_esp32_bench_ota]
extends = env:touchcontroller_esp32_bench
build_flags =
    %(GLOBAL_COMPILEFLAGS)s
    -DDEBUG_LEVEL=4
    %(LOCAL_DEBUGLEVEL)s
    -DLIGHTS_ADDRESS=67 -DPOOFER1_ADDRESS=71 -DPOOFER2_ADDRESS=72 -DCONTROL_MODE=%(CONTROL_MODE)s
    %(ESP32_TOUCH_FLAGS)s
    %(FC_OTA_FLAGS)s
upload_protocol = custom
upload_port = 192.168.1.59
extra_scripts = post:tools/upload_ota.py
